<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div class="container">
        <table>
            <thead>
                <th>id</th>
                <th>Product name</th>
                <th>Color</th>
                <th>description</th>
                <th>price</th>
                <th>categories</th>
                <th>quantity</th>
                <th>Actions</th>
            </thead>
            <tr th:each="product : ${products}">

                <td th:text="${product.id}"> Replaceable text </td >
                <td th:text="${product.productName}"> Replaceable text </td >
                <td th:text="${product.color}"> Replaceable text </td >
                <td th:text="${product.description}"> Replaceable text </td >
                <td th:text="${product.price}"> Replaceable text </td >
                <td th:text="${product.categories}"> Replaceable text </td >
                <td th:text="${product.quantity}"> Replaceable text </td >
                <td><a class="btn btn-success" th:href="@{/prd/{id}(id=${product.id})}" >Sửa</a></td >
            </tr>
        </table>
    </div>
</body>
</html>
